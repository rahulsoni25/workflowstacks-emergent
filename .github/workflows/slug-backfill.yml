name: Backfill catalog slugs

# 495 of 2,215 catalog entries never got a slug, so their pages resolve to
# /skills/<uuid> — a URL with no keyword signal, unreadable in a SERP and
# unquotable by an answer engine. The endpoint to fix it already exists; it had
# simply never been run against the current catalog.
#
# Manual by default: it writes to every slug-less row in the skills collection.
# `force: true` regenerates EXISTING slugs too, which changes live URLs — do
# not use it without a redirect plan.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate slugs that already exist (CHANGES LIVE URLs — leave false)'
        required: false
        default: 'false'

env:
  BASE_URL: https://workflowstacks.com

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Count what is missing a slug
        run: |
          TOTAL=$(curl -s "$BASE_URL/api/skills?limit=3000" | jq '[.skills[] | select((.slug // "") == "")] | length')
          echo "entries with no usable slug (tools): $TOTAL" | tee -a $GITHUB_STEP_SUMMARY

      - name: Backfill
        run: |
          echo '### backfill-slugs' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -s -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/backfill-slugs?force=${{ github.event.inputs.force || 'false' }}" \
            | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Recount
        run: |
          sleep 5
          LEFT=$(curl -s "$BASE_URL/api/skills?limit=3000" | jq '[.skills[] | select((.slug // "") == "")] | length')
          echo "still missing a slug after backfill: $LEFT" | tee -a $GITHUB_STEP_SUMMARY
