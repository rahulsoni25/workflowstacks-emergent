name: lighthouse

# Run Lighthouse against a live URL from a GitHub runner and print the category
# scores, core metrics and failing audits. Mobile by default; pass preset=desktop
# for the desktop profile.

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit
        required: true
        default: "https://workflowstacks.com/ai-avatar"
      preset:
        description: mobile (default) or desktop
        required: false
        default: "mobile"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ inputs.url }}
      PRESET: ${{ inputs.preset }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lighthouse
        run: |
          EXTRA=""
          if [ "$PRESET" = "desktop" ]; then EXTRA="--preset=desktop"; fi
          npx -y lighthouse@12 "$URL" $EXTRA --output=json --output-path=./lh.json --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo
      - name: Summary
        run: |
          node -e '
            const r = require("./lh.json");
            console.log("URL:", r.finalDisplayedUrl, "| profile:", process.env.PRESET);
            for (const [k, c] of Object.entries(r.categories)) console.log(`${k}: ${Math.round(c.score * 100)}`);
            const a = r.audits;
            for (const id of ["largest-contentful-paint","first-contentful-paint","cumulative-layout-shift","total-blocking-time","speed-index","interactive"])
              if (a[id]) console.log(`${id}: ${a[id].displayValue}`);
            console.log("--- failing or partial audits (score < 1) ---");
            for (const [k, c] of Object.entries(r.categories))
              for (const ref of c.auditRefs) {
                const au = a[ref.id];
                if (au && au.score !== null && au.score < 1 && au.scoreDisplayMode !== "informative")
                  console.log(`[${k}] ${ref.id} (${au.score}) — ${au.title}${au.displayValue ? " — " + au.displayValue : ""}`);
              }
            // Where the main-thread time goes, so a low TBT score names its cause.
            const items = (id) => ((a[id] && a[id].details && a[id].details.items) || []);
            console.log("--- main-thread work by category ---");
            for (const i of items("mainthread-work-breakdown")) console.log(`  ${i.groupLabel}: ${Math.round(i.duration)} ms`);
            console.log("--- script boot-up time by URL ---");
            for (const i of items("bootup-time")) console.log(`  ${i.url}: total ${Math.round(i.total)} ms, scripting ${Math.round(i.scripting)} ms`);
            console.log("--- long tasks ---");
            for (const i of items("long-tasks")) console.log(`  ${i.url}: ${Math.round(i.duration)} ms at ${Math.round(i.startTime)} ms`);
            console.log("--- third parties ---");
            for (const i of items("third-party-summary")) console.log(`  ${i.entity && (i.entity.text || i.entity)}: main-thread ${Math.round(i.mainThreadTime)} ms, blocking ${Math.round(i.blockingTime)} ms, ${Math.round(i.transferSize/1024)} KiB`);
            console.log("--- LCP element ---");
            for (const i of items("largest-contentful-paint-element")) console.log("  ", JSON.stringify(i).slice(0, 300));
            console.log("--- image savings ---");
            for (const id of ["uses-responsive-images","modern-image-formats"]) for (const i of items(id)) console.log(`  [${id}] ${i.url} — ${Math.round((i.wastedBytes||0)/1024)} KiB`);
            const reqs = items("network-requests"); console.log(`--- ${reqs.length} requests, ${Math.round(reqs.reduce((s,i)=>s+(i.transferSize||0),0)/1024)} KiB transferred ---`);
          '
