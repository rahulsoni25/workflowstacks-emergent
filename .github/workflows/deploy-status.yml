name: deploy-status

# Report what Vercel told GitHub about a commit: the GitHub Deployments it
# created (environment, state, URL) plus the commit's statuses and check runs.
# For when the person checking cannot reach the Vercel dashboard from where
# they are working. Read-only.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to report on (blank = the latest 10 deployments)
        required: false
        default: ""

permissions:
  contents: read
  deployments: read
  statuses: read
  checks: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Deployments
        run: |
          q="per_page=10"; [ -n "$SHA" ] && q="sha=$SHA&per_page=10"
          ids=$(gh api "repos/${{ github.repository }}/deployments?$q" --jq '.[].id')
          [ -z "$ids" ] && echo "no deployments found for ${SHA:-the repository}"
          for id in $ids; do
            gh api "repos/${{ github.repository }}/deployments/$id" \
              --jq '"\(.id) \(.environment) \(.sha[0:7]) created \(.created_at) \(.description // "")"'
            gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=3" \
              --jq '.[] | "   \(.state) \(.created_at) \(.description // "") \(.target_url // "")"'
          done
      - name: Commit statuses and check runs
        if: ${{ inputs.sha != '' }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$SHA/status" \
            --jq '"combined: \(.state)", (.statuses[] | "  \(.context): \(.state) \(.description // "") \(.target_url // "")")' || true
          gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '.check_runs[] | "  check: \(.name) \(.status) \(.conclusion // "") \(.details_url // "")"' || true
