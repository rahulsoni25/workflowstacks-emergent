name: Enrich Catalog
# Daily LLM enrichment pass (explainer + best_with_tools) over skills that
# still lack them. Idempotent: once coverage is complete it is a near no-op.
# Free (GitHub Actions free tier: 2,000 min/month, we use ~3 min/month).
#
# Calls /api/enrich-skills directly — twice, same as the old
# /api/cron/enrich-batch wrapper did — instead of going through the wrapper.
# The wrapper was a third Vercel function invocation that sat idle for the
# whole duration of the two real calls (billed wall-clock as provisioned
# memory) purely to forward them. The same endpoint was also on Vercel's own
# cron schedule (vercel.json) at 04:00, so the enrichment ran twice a day;
# that cron entry is gone and this workflow is the only schedule.
#
# Required secret: ADMIN_SECRET (same value set in Vercel env vars).

on:
  schedule:
    # Daily. Was every 15 min during the initial backfill push — that cadence
    # burned ~96 Vercel function runs/day (Fluid CPU + origin transfer) for a
    # job that is idempotent and mostly a no-op once coverage is reached.
    - cron: '17 5 * * *'
  workflow_dispatch: {}  # allow manual trigger from the Actions tab

env:
  BASE_URL: https://workflowstacks.com

jobs:
  enrich:
    # Emergency brake for Vercel usage: set the repository variable
    # PIPELINES_PAUSED=true (Settings → Secrets and variables → Actions →
    # Variables) and every scheduled pipeline that runs on Vercel functions
    # stops until it is unset. Manual "Run workflow" still works.
    if: ${{ github.event_name != 'schedule' || vars.PIPELINES_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pass 1 — enrich skills that have nothing yet
        run: |
          curl -sS --max-time 120 -X POST \
            -H "Content-Type: application/json" -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"limit":20}' \
            "$BASE_URL/api/enrich-skills" | head -c 600; echo

      - name: Pass 2 — refill best_with_tools on legacy-prompt skills
        run: |
          curl -sS --max-time 120 -X POST \
            -H "Content-Type: application/json" -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"limit":20,"needsBestWithTools":true}' \
            "$BASE_URL/api/enrich-skills" | head -c 600; echo

      - name: Show coverage
        run: |
          curl -sS --max-time 60 "$BASE_URL/api/enrich-skills" -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" 2>&1 | head -c 400 || true
