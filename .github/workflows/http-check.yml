name: http-check

# Probe one or more URLs (status, key headers, first bytes of the body) and
# the DNS behind them, from GitHub's runners. Useful when a hostname is
# being wired up (a new subdomain on Vercel) and the person debugging it
# cannot reach the site from where they are working.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to probe
        required: true
        default: "https://workflowstacks.com/ai-avatar https://founder-avatar.workflowstacks.com/ https://workflowstacks.com/sites/founder-avatar-studio/index.html"
      hosts:
        description: Space-separated hostnames to resolve
        required: false
        default: "workflowstacks.com founder-avatar.workflowstacks.com www.workflowstacks.com"
      user_agent:
        description: User-Agent to send (blank = curl's default). Use a Googlebot string to see what Google is served.
        required: false
        default: ""
      gsc:
        description: "Optional Search Console reads via /api/gsc, space-separated: 'sitemaps' and/or 'inspect:<url>'"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URLS: ${{ inputs.urls }}
      HOSTS: ${{ inputs.hosts }}
      UA: ${{ inputs.user_agent }}
    steps:
      - name: HTTP
        run: |
          for u in $URLS; do
            echo "=================== $u"
            code=$(curl -sS -o body.txt -D headers.txt --max-time 30 ${UA:+-A "$UA"} -w '%{http_code} %{time_total}s' "$u") || echo "curl exit $?"
            echo "status: $code"
            grep -iE '^(location|server|content-type|x-vercel-id|x-vercel-error|x-vercel-cache|x-matched-path|cache-control|x-robots-tag):' headers.txt || true
            echo "--- body, first 700 bytes ---"
            head -c 700 body.txt | tr -d '\r'; echo
            echo "--- tag ids in body ---"; grep -oE 'GTM-[A-Z0-9]{4,12}|G-[A-Z0-9]{6,12}|fbq\(.init.,.[0-9]{8,20}' body.txt | sort -u || true
            # What a search engine reads from this response: title, robots,
            # canonical, first H1, and how much visible text the HTML carries
            # before any JavaScript runs.
            echo "--- indexing signals ---"
            python3 - <<'PY'
          import re, html
          b = open('body.txt', encoding='utf-8', errors='replace').read()
          def first(p):
              m = re.search(p, b, re.I | re.S)
              return html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', m.group(1)))).strip()[:200] if m else None
          print('title:', first(r'<title[^>]*>(.*?)</title>'))
          print('meta robots:', re.findall(r'<meta[^>]+name="robots"[^>]*>', b, re.I) or None)
          print('canonical:', first(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"'))
          print('h1:', first(r'<h1[^>]*>(.*?)</h1>'))
          text = re.sub(r'<(script|style|noscript)[^>]*>.*?</\1>', ' ', b, flags=re.I | re.S)
          text = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text))).strip()
          print('html bytes:', len(b), '| visible text chars:', len(text))
          print('visible text sample:', text[:600])
          PY
          done
      - name: Search Console
        if: ${{ inputs.gsc != '' }}
        env:
          GSC: ${{ inputs.gsc }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          for spec in $GSC; do
            case "$spec" in
              inspect:*) q="action=inspect&url=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${spec#inspect:}")" ;;
              *) q="action=$spec" ;;
            esac
            echo "=================== gsc $spec"
            curl -sS --max-time 60 -H "x-admin-secret: $ADMIN_SECRET" "https://workflowstacks.com/api/gsc?$q" | head -c 4000; echo
          done
      - name: DNS
        run: |
          for n in $HOSTS; do
            echo "=================== $n"
            dig +noall +answer "$n" A
            dig +noall +answer "$n" CNAME
          done
          echo "=================== NS"
          dig +noall +answer NS "$(echo $HOSTS | cut -d' ' -f1)"
