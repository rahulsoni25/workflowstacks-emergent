name: Refresh stars (Hot list)

# The Hot list ranks by velocity_7d, which needs at least two star snapshots
# per repo. The daily content refresh manages ~800 repos a run against a
# published catalog of 3,000+, so a second snapshot took four days to arrive
# and /hot sat empty. This runs the same rotation every six hours: ~800 per
# run stays under GitHub's authenticated 5,000/hour cap, and the whole
# published catalog gets a snapshot roughly once a day — plenty for a 7-day
# velocity.
#
# 2026-09-28: moved off the Vercel-hosted /api/refresh-stars route entirely.
# This ran every 6h at up to 10 Vercel Function invocations a day just for
# this job (on top of every other workflow's calls), each billing its own
# Fluid Active CPU on a Hobby plan that's over its cap (checked same day:
# 5h47m/4h, 145%). The job only ever read/wrote Mongo and called the public
# GitHub API — none of that needs to run on Vercel. scripts/refresh-stars.mjs
# does the identical work directly against Mongo from this runner instead.
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Snapshot stars for the least-recently refreshed published repos
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/refresh-stars.mjs --max=80 --scope=published --passes=10 | tee /tmp/stars.log
          echo

      - name: Summary
        run: |
          echo "### Stars refreshed" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          grep '"summary":true' /tmp/stars.log >> $GITHUB_STEP_SUMMARY || echo "no summary line" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s "https://workflowstacks.com/api/hot" | jq -r '"Hot list entries: \(.hot | length)"' >> $GITHUB_STEP_SUMMARY || true
