name: OrderSense CI

# Typecheck, lint, unit tests and a production build for apps/ordersense.
# Runs in the GitHub runner only; it never calls the site (see docs/COSTS.md).
on:
  pull_request:
    paths: ['apps/ordersense/**', '.github/workflows/ordersense-ci.yml']
  push:
    branches: [main]
    paths: ['apps/ordersense/**', '.github/workflows/ordersense-ci.yml']

permissions:
  contents: read

jobs:
  ordersense:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ordersense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ordersense/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
