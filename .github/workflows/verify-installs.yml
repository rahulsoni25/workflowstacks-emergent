# Weekly verified-install run: actually installs the top skills' documented
# packages in this throwaway runner and reports pass/fail to the site, which
# then shows a "✓ Install verified" badge. Only strictly allowlisted
# single-package pip/npm installs are executed (see lib/safe-install.js).
name: verify-installs

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max skills to verify'
        default: '40'
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run install verification
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          # 40, not 10: at 10 a week the ~350 gated skills take most of a year to
          # cover once. The badge is the one quality signal on a page that is
          # ours rather than GitHub's, so cover the catalog in about two months.
          VERIFY_LIMIT: ${{ github.event.inputs.limit || '40' }}
        run: node scripts/verify-installs.mjs
