name: Codeflow backfill

# Manual lever to fill `codeflow` on skill pages faster than the daily job.
# Each call handles ~15 repos (GitHub tree + Groq flow) inside Vercel's 60s
# ceiling; `rounds` controls how many calls to make back-to-back.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Number of /api/codeflow calls (15 repos each)'
        required: false
        default: '10'
      llm:
        description: 'Generate the plain-English flow (true/false)'
        required: false
        default: 'true'
      force:
        description: 'Recompute even where codeflow already exists (true/false)'
        required: false
        default: 'false'
      cleanup:
        description: 'Maintenance op to run first (e.g. docs-flows) or empty'
        required: false
        default: ''

env:
  BASE_URL: https://workflowstacks.com

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Maintenance (optional)
        if: ${{ github.event.inputs.cleanup != '' }}
        run: |
          curl -s --max-time 60 -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/codeflow?cleanup=${{ github.event.inputs.cleanup }}"; echo

      - name: Backfill codeflow
        run: |
          rounds="${{ github.event.inputs.rounds || '10' }}"
          for i in $(seq 1 "$rounds"); do
            echo "== round $i/$rounds"
            out=$(curl -s --max-time 90 -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
              "$BASE_URL/api/codeflow?limit=15&llm=${{ github.event.inputs.llm || 'true' }}&force=${{ github.event.inputs.force || 'false' }}") || true
            echo "$out" | head -c 1500; echo
            if echo "$out" | grep -q '"rate_limited":true'; then echo "GitHub rate-limited — set GITHUB_TOKEN in Vercel; stopping"; break; fi
            stored=$(echo "$out" | sed -n 's/.*"stored":\([0-9]*\).*/\1/p')
            requested=$(echo "$out" | sed -n 's/.*"requested":\([0-9]*\).*/\1/p')
            if [ -z "$requested" ] || [ "$requested" = "0" ]; then echo "nothing left to process — stopping"; break; fi
            if [ "${stored:-0}" = "0" ]; then echo "no progress this round — stopping"; break; fi
            sleep 3
          done
