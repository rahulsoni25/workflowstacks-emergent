name: Daily blog pipeline

# One judged article a day: scout topics, start the best one, then advance the
# state machine step by step (each call is one small Vercel function run).
# The pipeline itself enforces the 1-post/day cap and the judge gate (>=8),
# and BLOG_AUTOPUBLISH=false in Vercel env parks posts at "judged" for manual
# approval in /admin/blog.
on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily — before the 06:00 content refresh
  workflow_dispatch: {}

env:
  BASE_URL: https://workflowstacks.com

permissions:
  contents: read
  issues: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - name: Rank check (feeds the scout real SERP positions)
        run: |
          curl -sf -X POST -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/blog/pipeline?action=rank&limit=8" | tee /tmp/rank.json || echo "rank check unavailable (SERP source rate-limited) — continuing"
          echo

      - name: Scout topics
        run: |
          curl -sf -X POST -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/blog/pipeline?action=scout" | tee /tmp/scout.json
          echo

      - name: Start the best open topic
        run: |
          curl -sf -X POST -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/blog/pipeline?action=start" | tee /tmp/start.json
          echo

      - name: Advance until done (sections → edit → judge → revise → schedule)
        run: |
          # 48: a judge score under the gate sends the article back for up to two
          # revisions, and a revision now rewrites ONE section per advance (that is
          # what fits Groq's 8k tokens-per-minute free tier). Worst case is 8 writes
          # + edit/humanize/judge + 2 x (8 sections + humanize + judge) = 31, plus
          # a retry or two. 30 would have cut a revising article off mid-loop.
          for i in $(seq 1 48); do
            # No -f: a non-2xx used to make curl exit silently and `|| break` ended
            # the loop with zero output — on 8 Sept the run went green having
            # written nothing, and the error body was never seen. Capture the
            # status and body, print both, then stop on failure.
            CODE=$(curl -s -o /tmp/adv.json -w '%{http_code}' -X POST -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
              "$BASE_URL/api/blog/pipeline?action=advance")
            R=$(cat /tmp/adv.json)
            echo "step $i (HTTP $CODE): $R"
            # A failed advance is almost always Groq's per-minute budget, spent
            # seconds earlier by `start`. Each pipeline step is idempotent, so
            # wait and retry rather than end the day's run on the first 429/5xx;
            # give up only after three consecutive failures. 8 and 9 Sept both
            # went green with zero sections written because the loop broke here.
            if [ "$CODE" -ge 400 ] || [ "$CODE" -lt 200 ]; then
              FAILS=$((${FAILS:-0}+1)); echo "ADVANCE FAILED — HTTP $CODE ($FAILS/3)"
              if [ "$FAILS" -ge 3 ]; then echo "### advance failed 3x (HTTP $CODE)" >> $GITHUB_STEP_SUMMARY; echo "$R" >> $GITHUB_STEP_SUMMARY; break; fi
              sleep 60; continue
            fi
            FAILS=0
            echo "$R" | jq -e '.idle == true' >/dev/null && break
            echo "$R" | jq -e '.step == "scheduled"' >/dev/null && break
            echo "$R" | jq -e '.status == "held"' >/dev/null && { echo "HELD"; break; }
            sleep 45
          done

      - name: Status summary
        run: |
          curl -sf -X POST -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "$BASE_URL/api/blog/pipeline?action=status" | tee /tmp/status.json
          echo "### Blog pipeline" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/start.json /tmp/status.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Open issue if a post was held by the judge
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `blog: daily pipeline failed ${new Date().toISOString().slice(0,10)}`,
              body: 'The daily blog pipeline run failed or a post was held by the judge. Check the Actions log and /admin/blog.',
            })
